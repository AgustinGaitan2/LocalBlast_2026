[project]
name = "localblast"
version = "0.1.0"
description = "LocalBlast · HU08_CU004_B: ejecutar la búsqueda validada y ver sus resultados"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
# La interfaz gráfica (Tkinter) y el punto de arranque no se prueban con pruebas
# unitarias: se verifican en la demostración (ver docs/design/cobertura.md).
omit = [
    "src/interfaz/cliente/pantalla_busqueda.py",
    "src/main.py",
    "src/infraestructura/datos_demo.py",
]

[tool.coverage.report]
show_missing = true
